# Direct copies initialize indexed DEST tiles before SFPU work consumes them.
dest_acc: true

operands:
  - name: input
    dims: [32, 160]
    format: Float32
  - name: output
    dims: [32, 160]
    format: Float32

operations:
  - dest_sync: SyncFull
    math:
      - type: Fpu
        in0: input
        operation: Datacopy
        unpacker: UnpackerA
        unpack_to_dest: true
        block_size: [32, 32]
        indexes:
          in0: [4, 3, 2, 1, 0]
          dest: 0
      - type: Fpu
        in0: input
        operation: Datacopy
        unpacker: UnpackerA
        unpack_to_dest: true
        block_size: [32, 32]
        indexes:
          in0: [0, 1, 2, 3, 4]
          dest: 1
      - type: UnarySfpu
        operation: Square
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes:
          dest: 0
      - type: BinarySfpu
        operation: SfpuElwadd
        approximation_mode: false
        iterations: 32
        block_size: [32, 32]
        indexes:
          src0: 0
          src1: 1
          dest: 2
    pack:
      - output: output
        packer: Packer
        block_size: [32, 32]
        indexes:
          dest: 2
          out: [0, 1, 2, 3, 4]
