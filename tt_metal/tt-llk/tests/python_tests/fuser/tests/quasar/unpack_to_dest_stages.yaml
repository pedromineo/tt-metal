# Odd section counts keep bank 1 live across per-operation unpack reinitialization.
dest_acc: true

operands:
  - name: input
    dims: [32, 96]
    format: Float32
  - name: stage1
    dims: [32, 96]
    format: Float32
  - name: stage2
    dims: [32, 96]
    format: Float32
  - name: output
    dims: [32, 96]
    format: Float32

operations:
  - math:
      - type: Fpu
        in0: input
        operation: Datacopy
        unpacker: UnpackerA
        unpack_to_dest: true
        block_size: [32, 32]
    pack:
      - output: stage1
        packer: Packer
        block_size: [32, 32]
  - math:
      - type: Fpu
        in0: stage1
        operation: Datacopy
        unpacker: UnpackerA
        unpack_to_dest: true
        block_size: [32, 32]
    pack:
      - output: stage2
        packer: Packer
        block_size: [32, 32]
  - math:
      - type: Fpu
        in0: stage2
        operation: Datacopy
        unpacker: UnpackerA
        unpack_to_dest: true
        block_size: [32, 32]
    pack:
      - output: output
        packer: Packer
        block_size: [32, 32]
